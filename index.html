<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Godwheel MVP</title>
<style>
  :root{
    --teal: rgb(0,143,111);
    --teal-dark: rgb(0,110,86);
    --mint-text: rgb(238,255,238);
    --row-bg: rgb(238,238,238);
    --row-border: rgb(170,170,170);
    --name-color: rgb(0,143,111);
    --label-color: rgb(102,136,136);
    --value-color: rgb(79,79,79);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Meiryo,system-ui,sans-serif;background:#222;display:flex;justify-content:center;align-items:center;min-height:100vh;}

  #stage{
    position:relative;width:1080px;height:720px;overflow:hidden;
    background: radial-gradient(ellipse at center, #bdf0e6 0%, #6fc9bd 60%, #3fa89c 100%);
    box-shadow:0 0 40px rgba(0,0,0,.5);
  }

  /* ===== top bar ===== */
  #topbar{position:absolute;left:0;top:0;width:1080px;height:44px;background:var(--teal);
    color:var(--mint-text);font-weight:bold;}
  #topbar .back{position:absolute;left:16px;top:0;height:44px;display:flex;align-items:center;
    cursor:pointer;font-size:20px;}
  #topbar .title{position:absolute;left:48px;top:0;height:44px;display:flex;align-items:center;
    font-size:16px;}
  #topbar .gfcounter{position:absolute;left:50%;top:8px;transform:translateX(-50%);
    background:rgba(255,255,255,.15);border-radius:16px;padding:4px 14px;color:#ffb3b3;}
  #topbar .bible{position:absolute;right:16px;top:0;height:44px;display:flex;align-items:center;
    cursor:pointer;}

  /* ===== bottom status bar ===== */
  #bottombar{position:absolute;left:0;top:696px;width:1080px;height:24px;background:var(--teal-dark);
    color:var(--mint-text);font-size:12px;display:flex;align-items:center;padding:0 10px;}
  #bottombar .name{flex:1;}
  #volume{display:flex;align-items:center;gap:6px;cursor:pointer;}
  #volume .speaker{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
    border-right:8px solid var(--mint-text);}
  #volume.muted .speaker{border-right-color:rgba(238,255,238,.35);}
  #volume .bars{display:flex;align-items:flex-end;gap:2px;height:12px;}
  #volume .bars .bar{width:3px;background:rgba(238,255,238,.35);}
  #volume .bars .bar.on{background:var(--mint-text);}

  /* ===== self name field (left) =====
     BUGFIX: previously top:36/height:40 (36-76) overlapped the 44px-tall top bar (0-44) by 8px.
     Moved to sit flush below the top bar instead. */
  #selfname{position:absolute;left:20px;top:50px;width:280px;height:40px;
    background:rgba(255,255,255,.6);border-radius:20px;display:flex;align-items:center;padding:0 16px;}
  #selfname input{border:none;background:transparent;font-weight:bold;color:var(--teal);font-size:18px;width:100%;outline:none;}

  /* ===== player panel: CONFIRMED fixed box, 390x400, left:680 ===== */
  #playerpanel{position:absolute;left:680px;top:36px;width:390px;height:400px;}
  #playerlist{position:absolute;left:0;top:0;width:390px;height:360px;}
  .prow{position:absolute;left:0;width:390px;height:40px;display:flex;align-items:center;}
  /* BUGFIX: switching stats to a row layout made the pill's total content wider than its
     340px box (row stats are wider than stacked ones), pushing the remove (X) button outside
     the visible pill. Tightened gaps/widths so everything fits again instead of overflowing. */
  .prow .pill{width:340px;height:40px;background:var(--row-bg);border:1px solid var(--row-border);
    border-radius:20px;display:flex;align-items:center;padding:0 10px;gap:6px;position:relative;}
  .prow .dot{width:18px;height:18px;border-radius:50%;border:2px solid #aaa;flex:none;}
  .prow input.pname{border:none;background:transparent;font-weight:bold;color:var(--name-color);
    font-size:18px;width:96px;outline:none;flex:none;}
  .prow .stat{display:flex;flex-direction:row;align-items:baseline;gap:2px;flex:none;}
  .prow .stat .lbl{font-size:10px;color:var(--label-color);font-weight:bold;flex:none;}
  .prow .stat input{border:none;background:transparent;width:22px;text-align:left;font-size:14px;
    color:var(--value-color);font-weight:bold;outline:none;}
  .prow .rm{margin-left:auto;cursor:pointer;color:#b33;font-weight:bold;font-size:16px;padding:0 2px;flex:none;}

  #miraclesbtn{position:absolute;left:90px;top:360px;width:250px;height:40px;background:#fff;
    border:1px solid var(--row-border);border-radius:20px;display:flex;align-items:center;
    justify-content:center;color:var(--teal);font-weight:bold;cursor:pointer;font-size:13px;}

  /* BUGFIX (again): #addplayer is a sibling of #playerpanel, not a child of it -- so its
     "left" is relative to the whole #stage, not the panel. Using left:90 (meant as
     "90px into the panel") put it at absolute x=90, nowhere near the panel at all,
     overlapping Pray. Panel starts at left:680, Miracles starts 90px into that (=770),
     so the absolute left here must be 680+90=770. */
  #addplayer{position:absolute;left:770px;top:444px;width:300px;height:28px;
    background:rgba(255,255,255,.35);border:1px dashed #fff;border-radius:14px;color:#fff;
    font-weight:bold;text-align:center;line-height:26px;cursor:pointer;font-size:13px;}

  /* Tooltip: shows details of the currently-hovered hand card. Sits below "+ Add player".
     Redesigned to match reference: thumbnail image on the left (its size drives the box
     height, plus a bit of padding) and name / stat / price on the right, matching the real
     client's card-detail popup rather than the earlier generic stat block. */
  #tooltip{position:absolute;left:770px;top:484px;width:300px;
    background:rgb(224,245,204);border:2px solid rgb(150,205,120);border-radius:8px;
    padding:8px;display:none;align-items:center;gap:10px;}
  #tooltip.visible{display:flex;}
  #tooltip .ttimg{width:64px;height:64px;flex:none;border-radius:4px;
    background:linear-gradient(135deg,#ffe98a,#ffd23f);}
  #tooltip .ttbody{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  #tooltip .ttname{font-weight:bold;color:rgb(70,60,10);font-size:15px;}
  #tooltip .ttstat{font-weight:bold;color:rgb(70,60,10);font-size:15px;}
  #tooltip .ttprice{flex:none;background:rgb(255,224,110);border-radius:50%;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;
    color:rgb(120,90,10);}

  /* ===== pray button ===== */
  #pray{position:absolute;left:20px;top:432px;width:260px;height:40px;background:var(--teal);
    border-radius:8px;color:var(--mint-text);font-weight:bold;font-size:18px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  #pray:active{background:var(--teal-dark);}

  #handrule{position:absolute;left:8px;top:478px;width:650px;height:6px;
    background:var(--teal);border-radius:3px;}

  /* Discard button.
     BUGFIX (again): icon should be a 1x4 grid (4 stacked horizontal cells, single column),
     not 2x2 -- and the box was too squished vertically. Bottom edge stays flush against the
     top of the hand grid (492), extended upward by increasing height instead of just
     stretching the existing box. */
  #discard{position:absolute;left:662px;top:402px;width:80px;height:90px;background:#e2e2e2;
    border:1px solid #aaa;border-radius:4px;cursor:pointer;box-sizing:border-box;
    padding:8px 14px;display:flex;flex-direction:column;gap:3px;}
  #discard .cell{flex:1;background:#f4f4f4;border:2px solid #999;border-radius:2px;}

  #cardserror{position:absolute;left:8px;top:658px;color:#a00;font-size:12px;font-weight:bold;
    height:16px;}

  /* ===== hand grid: 9 columns, 82px pitch, hard-capped at 18 (2 rows), no 3rd row ===== */
  #hand{position:absolute;left:8px;top:492px;width:738px;height:212px;}
  .card{position:absolute;width:80px;height:100px;background:#fff;border-radius:6px;
    box-shadow:0 2px 4px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden;cursor:default;}
  .card .art{flex:1;background:linear-gradient(135deg,#ffe98a,#ffd23f);display:flex;
    align-items:center;justify-content:center;font-size:11px;color:#7a5900;text-align:center;padding:2px;}
  .card .lbl{height:22px;background:#d7f5ec;color:#0a5c48;font-size:12px;font-weight:bold;
    text-align:center;line-height:22px;}
  .card .rm{position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,.55);
    color:#fff;border-radius:50%;font-size:11px;line-height:16px;text-align:center;cursor:pointer;}

  /* ===== NEW for the MVP wiring below (nothing above this line was touched) ===== */

  /* Action bar: target + confirm/cancel for the card currently being played, and the
     defend prompt when the bot attacks. Sits in the gap between Pray (ends at left:280)
     and the Miracles/discard column (starts at left:662), same vertical band as Pray. */
  #actionbar{position:absolute;left:290px;top:432px;width:372px;height:40px;display:none;
    align-items:center;gap:6px;}
  #actionbar.visible{display:flex;}
  #actionbar button{background:var(--teal);color:var(--mint-text);border:none;border-radius:8px;
    font-weight:bold;font-size:12px;padding:0 8px;height:32px;cursor:pointer;white-space:nowrap;}
  #actionbar button.alt{background:#fff;color:var(--teal);border:1px solid var(--teal);}

  /* Card selection/eligibility highlighting for the real play/defend interaction. */
  .card.eligible{outline:2px dashed #0a5c48;outline-offset:-2px;cursor:pointer;}
  .card.selected{outline:3px solid #0a5c48;outline-offset:-3px;cursor:pointer;}
</style>
</head>
<body>

<div id="stage">
  <div id="topbar">
    <span class="back">&#8592;</span>
    <span class="title">Training</span>
    <span class="gfcounter" id="gflabel">G.F. 1/50</span>
    <span class="bible">Bible</span>
  </div>

  <div id="selfname"><input id="selfnameinput" value="You" readonly></div>

  <div id="playerpanel">
    <div id="playerlist"></div>
    <div id="miraclesbtn">Miracles in hand: 0</div>
  </div>
  <div id="tooltip"></div>

  <div id="pray" onclick="passTurn()">Pass Turn</div>
  <div id="actionbar"></div>
  <div id="handrule"></div>
  <div id="discard" title="discard pile">
    <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  </div>
  <div id="cardserror"></div>

  <div id="hand"></div>

  <div id="bottombar">
    <span class="name">You</span>
    <span id="volume" onclick="toggleMute()"></span>
  </div>
</div>

<script type="module">
// This MVP loop is: one human (you) vs one bot, driven entirely by the
// Rust/wasm engine -- this file only renders state and forwards clicks.
// Build with `wasm-pack build --dev --target web` first (see build.bat);
// that produces ./pkg/godwheel_2.js, imported below.
import init, { WasmGame } from './pkg/godwheel_2.js';

let wasmGame = null;
let state = null; // last snapshot from wasmGame.state()

// ----- turn/selection UI state -----
let uiMode = 'idle';        // 'idle' | 'attack' | 'defend'
let baseSlot = null;        // hand slot of the attack's base card, in 'attack' mode
let comboSlots = new Set(); // attached combo card slots, in 'attack' mode
let selectedTarget = 'enemy'; // 'self' | 'enemy', in 'attack' mode
let defenseSlots = new Set(); // chosen defense card slots, in 'defend' mode
let pendingBotPlan = null;  // {slots, target, atk, cardNames}, in 'defend' mode

// ===================== PLAYER PANEL LAYOUT =====================
// CONFIRMED: 390x400 panel, bottom 40px reserved for "Performed Miracles" (top:360 fixed),
// remaining 360px block-centers N rows. Fixed at exactly 2 rows (You / Bot) -- the MVP is
// strictly 1v1, so there's no add/remove-player affordance any more.
function computeRowPitch(n){
  if(n<=2) return 133;
  return Math.min(80, 360/n);
}

function renderPlayers(){
  const list = document.getElementById('playerlist');
  list.innerHTML = '';
  const rows = [
    {name: state.you.name, hp: state.you.hp, mp: state.you.mp, gold: state.you.gold},
    {name: state.bot.name, hp: state.bot.hp, mp: state.bot.mp, gold: state.bot.gold},
  ];
  const pitch = computeRowPitch(rows.length);
  const blockHeight = (rows.length-1)*pitch + 40;
  const topGap = (360 - blockHeight)/2;

  rows.forEach((p, i)=>{
    const row = document.createElement('div');
    row.className = 'prow';
    row.style.top = (topGap + i*pitch)+'px';
    row.innerHTML = `
      <div class="pill">
        <div class="dot"></div>
        <input class="pname" value="${p.name}" readonly>
        <div class="stat"><div class="lbl">HP</div><input value="${p.hp}" readonly></div>
        <div class="stat"><div class="lbl">MP</div><input value="${p.mp}" readonly></div>
        <div class="stat"><div class="lbl">$</div><input value="${p.gold}" readonly></div>
      </div>`;
    list.appendChild(row);
  });

  document.getElementById('miraclesbtn').textContent =
    `Miracles in hand: ${state.you.hand.filter(c => c.persistent).length}`;
  document.querySelector('#bottombar .name').textContent = state.you.name;
}

// ===================== HAND GRID LAYOUT =====================
const COLS = 9, COL_PITCH = 82, ROW_PITCH = 102;

function cardLabel(c){
  if(c.atk != null){
    const sign = c.combo ? '+' : '';
    return c.atk >= 0 ? `${sign}ATK${c.atk}` : `HP${c.atk}`;
  }
  if(c.def != null) return `DEF${c.def}`;
  return c.name; // non-combat effect card (e.g. Mana Potion)
}

function isClickable(c){
  if(state.winner) return false;
  if(uiMode === 'idle') return c.playableAsBase;
  if(uiMode === 'attack') return c.slot === baseSlot || c.combo;
  if(uiMode === 'defend') return c.isDefense;
  return false;
}

function renderHand(){
  const hand = document.getElementById('hand');
  hand.innerHTML = '';
  state.you.hand.forEach(c => {
    const col = c.slot % COLS, row = Math.floor(c.slot / COLS);
    const el = document.createElement('div');
    el.className = 'card';
    if(c.slot === baseSlot || comboSlots.has(c.slot) || defenseSlots.has(c.slot)){
      el.classList.add('selected');
    } else if(isClickable(c)){
      el.classList.add('eligible');
    }
    el.style.left = (col*COL_PITCH)+'px';
    el.style.top = (row*ROW_PITCH)+'px';
    el.innerHTML = `
      <div class="art">${c.name}</div>
      <div class="lbl">${cardLabel(c)}</div>`;
    el.addEventListener('mouseenter', () => showTooltip(c));
    el.addEventListener('click', () => onCardClick(c));
    hand.appendChild(el);
  });
}

function onCardClick(c){
  if(!isClickable(c)) return;

  if(uiMode === 'idle'){
    if(c.atk == null && c.def == null){
      // Pure non-combat effect card: always self, resolves immediately.
      const res = JSON.parse(wasmGame.play_effect(c.slot));
      logResult(res.ok ? res.log : `Can't do that: ${res.error}`);
      afterHumanAction();
      return;
    }
    baseSlot = c.slot;
    comboSlots = new Set();
    selectedTarget = 'enemy';
    uiMode = 'attack';
    renderAll();
    return;
  }

  if(uiMode === 'attack'){
    if(c.slot === baseSlot){ cancelAttack(); return; }
    if(comboSlots.has(c.slot)) comboSlots.delete(c.slot); else comboSlots.add(c.slot);
    renderAll();
    return;
  }

  if(uiMode === 'defend'){
    if(defenseSlots.has(c.slot)) defenseSlots.delete(c.slot); else defenseSlots.add(c.slot);
    renderAll();
    return;
  }
}

function cancelAttack(){
  baseSlot = null; comboSlots = new Set(); uiMode = 'idle';
  renderAll();
}

function confirmAttack(){
  const combosJson = JSON.stringify(Array.from(comboSlots));
  const res = JSON.parse(wasmGame.play(baseSlot, combosJson, selectedTarget));
  baseSlot = null; comboSlots = new Set(); uiMode = 'idle';
  if(res.ok){
    logResult(formatAttackLog('You', selectedTarget === 'self' ? 'Yourself' : 'Bot', res));
  } else {
    logResult(`Can't do that: ${res.error}`);
  }
  afterHumanAction();
}

window.passTurn = function(){
  if(uiMode !== 'idle' || (state && state.winner)) return;
  logResult('You pass.');
  afterHumanAction();
};

function formatAttackLog(attackerName, targetName, res){
  let msg = `${attackerName} -> ${targetName}: ATK ${res.atk} (${res.color}).`;
  msg += (res.defendedWith && res.defendedWith.length)
    ? ` Defended with ${res.defendedWith.join(', ')} (DEF ${res.def}).`
    : ' No defense.';
  msg += ` Net change: ${res.damage} HP.`;
  if(res.revivedBy) msg += ` -- would have been lethal, but ${res.revivedBy} saved them!`;
  return msg;
}

// ===================== ACTION BAR =====================
function mkButton(text, cls, onclick){
  const b = document.createElement('button');
  b.textContent = text;
  if(cls) b.className = cls;
  b.onclick = onclick;
  return b;
}

function renderActionBar(){
  const bar = document.getElementById('actionbar');
  bar.innerHTML = '';
  if(uiMode === 'attack'){
    bar.classList.add('visible');
    bar.append(
      mkButton(selectedTarget === 'self' ? 'Target: Yourself \u2713' : 'Target: Yourself', 'alt',
        () => { selectedTarget = 'self'; renderAll(); }),
      mkButton(selectedTarget === 'enemy' ? 'Target: Bot \u2713' : 'Target: Bot', 'alt',
        () => { selectedTarget = 'enemy'; renderAll(); }),
      mkButton('Confirm', '', confirmAttack),
      mkButton('Cancel', 'alt', cancelAttack),
    );
  } else if(uiMode === 'defend'){
    bar.classList.add('visible');
    const label = document.createElement('span');
    label.style.cssText = 'color:#fff;font-weight:bold;font-size:12px;max-width:210px;';
    label.textContent = `Bot plays ${pendingBotPlan.cardNames.join(' + ')} (ATK ${pendingBotPlan.atk})`;
    bar.append(label, mkButton('Confirm Defense', '', confirmDefense));
  } else {
    bar.classList.remove('visible');
  }
}

// ===================== BOT TURN =====================
function afterHumanAction(){
  refreshState();
  if(state.winner){ renderAll(); return; }

  const plan = JSON.parse(wasmGame.bot_plan());
  if(!plan.hasMove){
    logResult('Bot passes.', true);
    refreshState();
    renderAll();
    return;
  }
  if(plan.target === 'bot'){
    const res = JSON.parse(wasmGame.bot_resolve(JSON.stringify(plan.slots), 'bot', '[]'));
    logResult(res.ok ? formatAttackLog('Bot', 'Itself', res) : `Bot's move fizzled: ${res.error}`, true);
    refreshState();
    renderAll();
    return;
  }
  // Bot is attacking you -- let you pick a defense before it resolves.
  pendingBotPlan = plan;
  defenseSlots = new Set();
  uiMode = 'defend';
  refreshState();
  renderAll();
}

function confirmDefense(){
  const plan = pendingBotPlan;
  const res = JSON.parse(wasmGame.bot_resolve(
    JSON.stringify(plan.slots), 'you', JSON.stringify(Array.from(defenseSlots))
  ));
  pendingBotPlan = null;
  defenseSlots = new Set();
  uiMode = 'idle';
  logResult(res.ok ? formatAttackLog('Bot', 'You', res) : `Bot's move fizzled: ${res.error}`, true);
  refreshState();
  renderAll();
}

// ===================== LOG LINE (reuses the old #cardserror slot) =====================
function logResult(msg, append){
  const el = document.getElementById('cardserror');
  el.textContent = append ? `${el.textContent}  ${msg}` : msg;
}

// ===================== TOOLTIP =====================
function showTooltip(c){
  const tt = document.getElementById('tooltip');
  tt.innerHTML = `
    <div class="ttimg"></div>
    <div class="ttbody">
      <div class="ttname">${c.name}</div>
      <div class="ttstat">${c.desc || cardLabel(c)}</div>
    </div>
    <div class="ttprice">$${c.price}</div>`;
  tt.classList.add('visible');
}

// ===================== VOLUME SLIDER (decorative, unchanged from the mockup) =====================
let volumeLevel = 7;
let volumeBeforeMute = 7;
function renderVolume(){
  const el = document.getElementById('volume');
  el.classList.toggle('muted', volumeLevel === 0);
  const bars = Array.from({length:10}, (_, i) => {
    const h = 4 + i*1;
    const on = i < volumeLevel;
    return `<div class="bar ${on?'on':''}" onclick="event.stopPropagation(); setVolume(${i+1})" style="height:${h}px"></div>`;
  }).join('');
  el.innerHTML = `<span class="speaker"></span><span class="bars">${bars}</span>`;
}
window.setVolume = function(n){ volumeLevel = n; if(n>0) volumeBeforeMute = n; renderVolume(); };
window.toggleMute = function(){
  if(volumeLevel > 0){ volumeBeforeMute = volumeLevel; setVolume(0); }
  else { setVolume(volumeBeforeMute || 7); }
};

// ===================== MAIN =====================
function refreshState(){
  state = JSON.parse(wasmGame.state());
}

function renderAll(){
  renderPlayers();
  renderHand();
  renderActionBar();
  const idle = uiMode === 'idle' && !state.winner;
  const prayBtn = document.getElementById('pray');
  prayBtn.style.opacity = idle ? '1' : '.5';
  prayBtn.style.pointerEvents = idle ? 'auto' : 'none';
  if(state.winner){
    logResult(state.winner === 'you' ? 'You win!' : 'You lose...');
  }
}

async function main(){
  await init();
  wasmGame = new WasmGame();
  refreshState();
  renderVolume();
  renderAll();
}
main();
</script>
</body>
</html>
