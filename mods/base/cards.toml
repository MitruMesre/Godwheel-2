# Base mod: the vanilla card set, declared the same way any third-party
# mod would declare cards (structure.md). MVP set only.
#
# Every numeric card -- weapon, self-heal, or miracle/spell -- is a
# `combat` card: atk is signed, negative = heal. There is no separate
# "deal damage" or "restore health" card type. `target` below is only a
# hint the bot AI uses to decide who to aim itself at; a human player
# can target either side with any card.

[iron_sword]
target = "enemy"
price = 5
count = 2

[iron_sword.combat]
atk = 5

[steel_sword]
target = "enemy"
price = 8
count = 1

[steel_sword.combat]
atk = 8

[iron_shield]
price = 5
count = 2

[iron_shield.combat]
def = 5

[steel_shield]
price = 8
count = 1

[steel_shield.combat]
def = 8

[sharpening_stone]
combo = true
count = 2

[sharpening_stone.combat]
atk = 2

# A miracle: costs mana and is persistent (played, but not discarded --
# it moves to a back hand slot instead of leaving your hand).
[fireball]
target = "enemy"
mana_cost = 4
persistent = true
count = 2
elements = ["fire"]

[fireball.combat]
atk = 6

# A self-heal is just an attack with negative atk, aimed at yourself.
[healing_potion]
target = "self_target"
count = 3

[healing_potion.combat]
atk = -10

[mana_potion]
target = "self_target"
count = 2

[mana_potion.effect]
type = "restore_mana"
amount = 8

[sun_amulet]
playable = false
persistent = true
count = 1

[[sun_amulet.hooks.on_death]]
type = "restore_health"
amount = 10
